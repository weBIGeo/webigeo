<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
    <title>Alpine Maps</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      #qtspinner {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-family: sans-serif;
      }

      #qtspinner img {
        width: min(70vw, 420px);
        height: auto;
      }

      #qtstatus {
        margin-top: 1rem;
      }

      #screen {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body onload="init()">
    <div id="qtspinner">
      <img src="logo_vertical_light_bg.png" alt="Alpine Maps">
      <div id="qtstatus"></div>
      <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
    </div>
    <div id="screen"></div>

    <script>
      async function init() {
        const spinner = document.querySelector('#qtspinner');
        const screen = document.querySelector('#screen');
        const status = document.querySelector('#qtstatus');

        const showUi = ui => {
          [spinner, screen].forEach(element => element.style.display = 'none');
          ui.style.display = ui === spinner ? 'flex' : 'block';
        };

        try {
          showUi(spinner);
          status.textContent = 'Loading...';

          await qtLoad({
            qt: {
              onLoaded: () => showUi(screen),
              onExit: exitData => {
                let message = 'Application exit';
                message += exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                message += exitData.text !== undefined ? ` (${exitData.text})` : '';
                status.textContent = message;
                showUi(spinner);
              },
              entryFunction: window.alpineapp_entry,
              containerElements: [screen],
            },
          });
        } catch (error) {
          console.error(error);
          console.error(error.stack);
          status.textContent = 'Failed to load Alpine Maps.';
        }
      }
    </script>
    <script src="alpineapp.js"></script>
    <script src="qtloader.js"></script>
  </body>
</html>
